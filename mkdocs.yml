site_name: SMLR
site_description: Surrogate Models for Linear Response - Fast, accurate emulation of strength functions
site_url: https://example.com  # update when deploying
repo_url: https://github.com/ascsn/SMLR
repo_name: ascsn/SMLR

nav:
  - Home: index.md
  - Getting Started:
    - Usage Guide: usage.md
    - Tutorials: tutorials.md
  - Examples:
    - Gallery: examples/index.md
    - XANES Spectroscopy: notebooks/materials_spectroscopy.ipynb
    - Structural Vibration: notebooks/structural_vibration.ipynb
    - Backend Comparison: notebooks/backend_comparison.ipynb
    - Acoustic Resonance (Toy): notebooks/acoustic_resonance.ipynb
    - High-Dimensional (Toy): notebooks/high_dim_emulation.ipynb
  - Reference Examples:
    - Nuclear Response: examples/nuclear_response.md
    - "β-Decay Comparison": examples/beta_decay_comparison.md
  - Documentation:
    - API Reference: api_reference.md
    - Theory & Background: theory.md
    - FAQ: faq.md
  - Reproducibility:
    - Paper Reproduction: paper_repro.md
    - Paper Notebook: paper_repro_notebook.ipynb
  - Development:
    - Contributing: contributing.md
    - Development Guide: development.md
    - Changelog: changelog.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      include_source: true
      allow_errors: false
      kernel_name: python3
      ignore:
        - "hooks.py"
        - "_*.ipynb"
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: numpy
            docstring_section_style: spacy
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
  - macros

hooks:
  - docs/hooks.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ascsn/SMLR
      name: GitHub Repository
  version:
    provider: mike

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/neobrutalism.css
