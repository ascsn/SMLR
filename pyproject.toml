[project]
name = "smlr"
version = "0.1.0"
description = "Surrogate Models for Linear Response"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "jinlauren", email = "ljin3634@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]
keywords = ["linear-response", "emulator", "surrogate-model", "spectral-function"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[project.optional-dependencies]
paper = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scipy>=1.14",
    "tensorflow>=2.20",
]
tensorflow = [
    "tensorflow>=2.20",
]
yaml = [
    "pyyaml>=6.0",
]
examples = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=2.0",
]
