[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "smlr"
version = "0.2.0"
description = "Generalized surrogate models for linear-response strength functions"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "SMLR Contributors" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-jupyter>=0.25",
]
tensorflow = [
  "tensorflow>=2.12",
]
jax = [
  "jax>=0.4",
  "jaxlib>=0.4",
  "optax>=0.1.7",
]
all = [
  "tensorflow>=2.12",
  "jax>=0.4",
  "jaxlib>=0.4",
  "optax>=0.1.7",
]

[dependency-groups]
dev = [
  "mkdocstrings>=0.30.1",
  "mkdocstrings-python>=1.18.2",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-jupyter>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smlr"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "W"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
