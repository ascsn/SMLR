name = "slurm-auditor"
category = "hpc-workflow"

purpose = "Review SLURM scripts for resource requests, environment setup, array-job behavior, logging, and restart safety."

use_when = [
  "Submitting expensive jobs.",
  "Moving workflows between clusters.",
  "Debugging failed batch jobs.",
  "Scaling from test runs to production sweeps.",
]

helpful_inputs = [
  "SLURM or batch scripts.",
  "Module load commands and environment files.",
  "Expected runtime, memory, CPU/GPU, and array size.",
  "Log files from failed or slow jobs.",
]

expected_output = [
  "Resource request review.",
  "Environment and path risks.",
  "Logging and checkpoint recommendations.",
  "Safer submission command examples.",
]
