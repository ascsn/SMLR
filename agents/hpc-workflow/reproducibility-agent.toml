name = "reproducibility-agent"
category = "hpc-workflow"

purpose = "Make workflows rerunnable by capturing commands, configs, software versions, seeds, inputs, and outputs."

use_when = [
  "Creating final result notebooks.",
  "Preparing a release or archive.",
  "Sharing runs with collaborators.",
  "Comparing results across machines or dates.",
]

helpful_inputs = [
  "Scripts and notebooks.",
  "CLI logs.",
  "Environment files.",
  "Output folders.",
  "Random seeds and parameter grids.",
]

expected_output = [
  "Reproducibility checklist.",
  "Missing metadata.",
  "Suggested run manifest.",
  "Commands needed to regenerate key artifacts.",
]
