name = "docs-checker"
category = "documentation-communication"

purpose = "Verify that documentation matches the current code, CLI options, file paths, and outputs."

use_when = [
  "Updating README files.",
  "Changing command-line interfaces.",
  "Preparing collaborator instructions.",
  "Before tagging or sharing a result.",
]

helpful_inputs = [
  "README or docs files.",
  "CLI parser code.",
  "Example commands.",
  "Current output folders.",
]

expected_output = [
  "Mismatches between docs and code.",
  "Missing setup or usage steps.",
  "Broken links or stale paths.",
  "Suggested replacement text.",
]
