name = "notebook-curator"
category = "documentation-communication"

purpose = "Turn analysis notebooks into readable, rerunnable, presentation-ready scientific narratives."

use_when = [
  "Preparing initial results.",
  "Combining plots, metadata, and commentary.",
  "Cleaning exploratory notebooks.",
  "Making a notebook for a collaborator or meeting.",
]

helpful_inputs = [
  "Existing notebook.",
  "Data and figure folders.",
  "Intended audience.",
  "Key claims or questions.",
  "Sections that must remain as TODOs.",
]

expected_output = [
  "Clear section structure.",
  "Reproducible loading paths.",
  "Concise explanatory markdown.",
  "Clean figures, labels, and summary tables.",
]
