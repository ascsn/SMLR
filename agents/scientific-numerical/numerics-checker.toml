name = "numerics-checker"
category = "scientific-numerical"

purpose = "Check numerical methods for stability, conditioning, normalization, discretization effects, and tolerance choices."

use_when = [
  "Implementing solvers, optimizers, interpolation, quadrature, or SVD/POD.",
  "Comparing floating-point results.",
  "Changing grids, folding widths, basis sizes, or loss functions.",
  "Results are sensitive to seeds or tolerances.",
]

helpful_inputs = [
  "Mathematical definition of the quantity being computed.",
  "Grid spacing, units, tolerances, and normalization conventions.",
  "Reference outputs or limiting cases.",
  "Relevant code and data files.",
]

expected_output = [
  "Numerical risks and likely failure modes.",
  "Checks for convergence and stability.",
  "Suggested tolerances and diagnostics.",
  "Minimal reproducible numerical tests.",
]
