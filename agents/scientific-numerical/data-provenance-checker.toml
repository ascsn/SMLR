name = "data-provenance-checker"
category = "scientific-numerical"

purpose = "Verify where data came from, how it was generated, and whether metadata, filenames, parameters, and scripts agree."

use_when = [
  "Building notebooks from generated results.",
  "Combining data across folders.",
  "Preparing results for collaborators.",
  "Re-running old workflows.",
]

helpful_inputs = [
  "Data directories.",
  "Generation scripts.",
  "CLI command logs.",
  "Metadata JSON files.",
  "Naming conventions and parameter regexes.",
]

expected_output = [
  "Data lineage summary.",
  "Missing or inconsistent metadata.",
  "Parameter coverage table.",
  "Reproducibility gaps and fixes.",
]
