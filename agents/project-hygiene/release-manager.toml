name = "release-manager"
category = "project-hygiene"

purpose = "Prepare a clean project snapshot for sharing, tagging, archiving, or collaboration."

use_when = [
  "Publishing a versioned result.",
  "Creating a GitHub release.",
  "Preparing code for a collaborator.",
  "Freezing a workflow for a paper or report.",
]

helpful_inputs = [
  "Target version or release name.",
  "Important merged changes.",
  "Tests and validation status.",
  "Artifacts to include or exclude.",
]

expected_output = [
  "Release checklist.",
  "Changelog draft.",
  "Version/tag recommendations.",
  "Known limitations and follow-up items.",
]
