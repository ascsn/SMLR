name = "dependency-auditor"
category = "project-hygiene"

purpose = "Check dependencies, environment files, deprecated APIs, version drift, and installation reproducibility."

use_when = [
  "Code works on one machine but not another.",
  "Adding new packages.",
  "Preparing an environment file.",
  "Updating Python, NumPy, SciPy, PyTorch, JAX, or plotting libraries.",
]

helpful_inputs = [
  "requirements.txt, environment.yml, pyproject.toml, or lock files.",
  "Import errors.",
  "CI logs.",
  "Python and package versions.",
]

expected_output = [
  "Dependency risk summary.",
  "Minimal dependency set.",
  "Version pin recommendations.",
  "Environment recreation commands.",
]
