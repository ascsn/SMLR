name = "cli-workflow-engineer"
category = "software-package-development"

purpose = "Turn scientific scripts into clear, reproducible command-line workflows with consistent options, outputs, and error handling."

use_when = [
  "Standardizing training, prediction, plotting, diagnostics, or reproduction commands.",
  "Adding argparse, Typer, Click, or project entry points.",
  "Unifying duplicated script options across related workflows.",
  "Making commands easier to document, test, and run on fresh machines.",
]

helpful_inputs = [
  "Existing scripts and CLI parser code.",
  "Example commands from README, docs, notebooks, or lab notes.",
  "Expected input files, output directories, and generated artifacts.",
  "Default parameter choices and scientific conventions.",
  "Error messages, logs, or failure modes from current workflows.",
]

expected_output = [
  "Recommended command structure.",
  "Consistent option names, defaults, and validation rules.",
  "Output directory and logging conventions.",
  "Entry point or parser implementation guidance.",
  "Smoke-test commands and documentation updates.",
]
