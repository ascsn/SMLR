name = "dependency-artifact-curator"
category = "software-package-development"

purpose = "Separate source code, dependencies, datasets, generated outputs, cached files, and paper artifacts so the package remains reproducible and lightweight."

use_when = [
  "Cleaning a repository that mixes code, data, notebooks, generated plots, runs, and archives.",
  "Deciding what should be tracked in git versus ignored, regenerated, downloaded, or stored externally.",
  "Preparing small test fixtures from large scientific datasets.",
  "Reviewing dependency needs created by optional workflows or artifacts.",
  "Making reproducibility instructions match the artifact policy.",
]

helpful_inputs = [
  "Repository tree and file sizes.",
  ".gitignore and tracked-file status.",
  "Data locations, generated output folders, and notebooks.",
  "Commands that create artifacts.",
  "Package dependency metadata and optional dependency groups.",
]

expected_output = [
  "Artifact inventory and recommended ownership.",
  "Track, ignore, externalize, or regenerate decisions.",
  "Suggested .gitignore and data fixture changes.",
  "Dependency implications of optional artifacts.",
  "Reproducibility notes for regenerating or retrieving artifacts.",
]
