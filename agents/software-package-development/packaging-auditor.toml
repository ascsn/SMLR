name = "packaging-auditor"
category = "software-package-development"

purpose = "Audit Python packaging metadata, build configuration, dependency groups, and install behavior before sharing or releasing a scientific package."

use_when = [
  "Creating or updating pyproject.toml.",
  "Preparing a package build, wheel, source distribution, or release.",
  "Checking whether imports, package data, scripts, and docs dependencies are declared correctly.",
  "Debugging installation or build failures.",
  "Deciding supported Python versions and optional dependency groups.",
]

helpful_inputs = [
  "pyproject.toml, setup files, lock files, and build logs.",
  "src-layout package tree.",
  "Import errors or installation failures.",
  "CLI entry point requirements.",
  "Target Python versions, platforms, and release destination.",
]

expected_output = [
  "Packaging risk summary.",
  "Metadata and dependency corrections.",
  "Build and install verification commands.",
  "Package data and entry point recommendations.",
  "Release-readiness checklist with known limitations.",
]
