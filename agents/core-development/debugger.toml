name = "debugger"
category = "core-development"

purpose = "Find the cause of failures and propose or implement the smallest reliable fix."

use_when = [
  "A script crashes.",
  "Tests fail.",
  "Results look wrong.",
  "A workflow breaks only for certain parameters, seeds, or machines.",
]

helpful_inputs = [
  "Error messages and stack traces.",
  "Commands used to reproduce the issue.",
  "Relevant input data or config files.",
  "Recent changes.",
  "Expected versus actual behavior.",
]

expected_output = [
  "Root cause summary.",
  "Reproduction steps.",
  "Minimal fix or recommended fix path.",
  "Regression test or verification step.",
]
